##
# this builds a module and mirrors it to some other git-host via a secret
# 
# PUSH_PUBLIC=https://g-pechorin:github_pat_????@github.com/g-pechorin/eJSON.git
#
#
# 2025-07-26; modified the workflow to skip the mirror steps on repos with no push-public var
name: build this sbt module
on:
  push:
    branches:
      - "*"
jobs:
  build:
    container:
      image: node:lts-bookworm
    runs-on: sam1
    steps:
      - name: setup sbt et al
        run: |
          echo "deb https://repo.scala-sbt.org/scalasbt/debian all main" | tee /etc/apt/sources.list.d/sbt.list
          echo "deb https://repo.scala-sbt.org/scalasbt/debian /" | tee /etc/apt/sources.list.d/sbt_old.list
          curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | gpg --dearmor > /etc/apt/trusted.gpg.d/scalasbt.gpg
          apt update
          apt install -y --no-install-recommends openjdk-17-jdk sbt
          apt clean
          rm -rf /var/lib/apt/lists/*          
      - name: checkout
        uses: actions/checkout@v2
      - name: Set up GitHub remote with PAT
        if: ${{ secrets.PUSH_PUBLIC != '' }}
        env:
          PUSH_PUBLIC: ${{ secrets.PUSH_PUBLIC }}
        run: |
          git remote add push_public "${PUSH_PUBLIC}"
          git remote -v
          git fetch --unshallow                    
      - name: build
        run: |
          sbt compile                    
      - name: test
        run: |
          sbt test                    
      - name: push dry
        if: ${{ secrets.PUSH_PUBLIC != '' }}
        run: |
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git push --force --dry-run push_public HEAD:$CURRENT_BRANCH                    
      - name: push hot
        if: ${{ github.ref_name == 'default' && secrets.PUSH_PUBLIC != '' }}
        run: |
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git push --force push_public HEAD:$CURRENT_BRANCH
